export ANDROID_HOME="/opt/android/sdk"
export PATH="$PATH:/opt/android/sdk/cmdline-tools/tools/bin"
if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
  curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
  unzip sdk.zip
  rm sdk.zip
  mkdir "$ANDROID_HOME/cmdline-tools"
  mv cmdline-tools "$ANDROID_HOME/cmdline-tools/tools"
  yes | "$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
fi

cd android-project
chmod +x gradlew
./gradlew assembleRelease
